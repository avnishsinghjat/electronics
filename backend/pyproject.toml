[project]
name = "fabtrack-backend"
version = "0.0.1"
description = "FabTrack: offline electronics manufacturing ERP (API and worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "argon2-cffi>=23",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "email-validator>=2",
  "openpyxl>=3.1",
  "weasyprint>=62",
  "jinja2>=3.1",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "factory_boy>=3.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/*.css", "templates/fonts/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
  "integration: needs external tools (kicad-cli, LM Studio); skipped when absent",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs ORM code in greenlets; without this, lines after an
# await are under-reported.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
warn_return_any = false
# Decimal == int comparisons are intended in assertions.
disable_error_code = ["comparison-overlap"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "weasyprint", "weasyprint.*", "segno", "segno.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["factory", "factory.*"]
follow_imports = "skip"
ignore_missing_imports = true
